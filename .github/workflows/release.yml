name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows (win64)
        run: |
          chmod +x scripts/*.sh
          bash scripts/build.sh win --version "${{ needs.prep.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gen1recomp-win64
          path: dist/win/gen1recomp-win64.zip

  build-linux:
    needs: prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install squashfs tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Build Linux (AppImage)
        run: |
          chmod +x scripts/*.sh
          bash scripts/build.sh linux --version "${{ needs.prep.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gen1recomp-linux
          path: dist/linux/gen1recomp-linux.zip

  build-macos:
    needs: prep
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LOVE.app
        run: brew install --cask love
      - name: Build macOS app (unsigned)
        run: |
          chmod +x scripts/*.sh
          bash scripts/build.sh mac --version "${{ needs.prep.outputs.version }}" --no-notarize
      - uses: actions/upload-artifact@v4
        with:
          name: gen1recomp-macos
          path: dist/mac/gen1recomp-macos.zip

  build-android:
    needs: prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install NDK 25.2.9519653 + platform 34
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-34" "ndk;25.2.9519653"
      - name: Build Android APK (debug)
        run: |
          chmod +x scripts/*.sh
          bash scripts/build.sh android --version "${{ needs.prep.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gen1recomp-android
          path: dist/android/debug/*.apk

  release:
    needs: [prep, build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.zip" -o -name "*.apk" \) -exec cp {} release-files/ \;
          ls -la release-files

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-files/* \
            --title "gen1recomp ${GITHUB_REF_NAME}" \
            --generate-notes